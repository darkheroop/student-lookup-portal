<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lookup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <h1 class="title">Lookup</h1>

      <form id="lookupForm" novalidate>
        <div class="form-group">
          <label for="studentNumber" class="label">10-Digit Number</label>
          <input
            type="text"
            id="studentNumber"
            name="studentNumber"
            inputmode="numeric"
            maxlength="10"
            placeholder="Enter 10-digit number"
            autocomplete="off"
            required
            aria-describedby="errorMessage"
          >
        </div>

        <button type="submit" id="submitBtn" class="btn">Submit</button>
      </form>

      <!-- Loading Indicator -->
      <div id="loadingIndicator" class="loading-box" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>Processing...</span>
      </div>

      <!-- Error Message Area -->
      <div id="errorMessage" class="error-box" role="alert" aria-live="polite" hidden></div>

      <!-- Result Area -->
      <div id="resultArea" class="result-box" aria-live="polite" hidden>
        <div class="result-row">
          <span class="result-label">Username:</span>
          <div class="result-value-group">
            <span id="resultUsername" class="result-value"></span>
            <button
              type="button"
              id="copyUsernameBtn"
              class="copy-btn"
              title="Copy Username"
              aria-label="Copy Username"
            >
              <svg class="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="result-row">
          <span class="result-label">Password:</span>
          <div class="result-value-group">
            <span id="resultPassword" class="result-value"></span>
            <button
              type="button"
              id="copyPasswordBtn"
              class="copy-btn"
              title="Copy Password"
              aria-label="Copy Password"
            >
              <svg class="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="copyFeedback" class="copy-feedback" role="status" aria-live="polite" hidden></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
